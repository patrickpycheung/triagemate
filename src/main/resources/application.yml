spring:
  application:
    name: triage-copilot
  # Secrets live in a gitignored Java properties file at the project root (copy
  # secrets.properties.example → secrets.properties). Optional: absent for the offline
  # demo. Its triage.integrations.* values override the env placeholders below.
  config:
    import: "optional:file:secrets.properties"

server:
  port: 8080

triage:
  # Per-connector data source: mock (offline demo data) or real (live system).
  # Mix freely — e.g. servicenow=real writes the two advisory comments to a REAL dev
  # ticket while the evidence stays mock/curated.
  connectors:
    servicenow: mock
    confluence: mock
    sumo: mock
    gitlab: mock

  # engine: 'deterministic' (default, offline, no LLM) | 'adk' (live agent, -Padk build)
  engine: deterministic

  agent:
    # FND-27: was previously an inline @Value default only, absent from both this file
    # and every card — every other triage.* key is declared here. J8's tool-call
    # budget (J2's BoundsCallback); the allowlist itself is not configurable, it's the
    # fixed set of 8 registered tools (see AdkDiagnosisEngine.ALLOWED_TOOLS).
    max-tool-calls: 10

  trigger:
    # K1 — outbound polling (DDS servicenow-local-trigger). ServiceNow can't reach a
    # corp-network laptop, so the app polls out instead of being pushed to.
    # OFF by default: the demo uses the manual POST /api/diagnose/{number} (K3), and a
    # poller waking up mid-presentation to diagnose unrelated tickets is a stage hazard.
    poll:
      enabled: false
      interval-ms: 30000     # 30s — poll latency is the accepted cost of no inbound path
      batch-limit: 10        # max incidents pulled per tick
      completed-cap: 500     # in-process completed-set bound (FND-1 layer 3)

  writeback:
    # Automatic advisory write-back (J5) — two comments per run (sources first, then
    # diagnosis). No human in the loop. It only comments; never reassigns/closes/re-prioritises.
    enabled: true

  orchestrator:
    # FND-15: wall-clock bound on a single engine call (either engine — the deterministic
    # one makes real HTTP calls too once triage.connectors.*=real). A hung gateway or proxy
    # previously hung the request forever, including on the K1 poller's single scheduler
    # thread. A timeout on the ADK engine degrades via the normal FND-7 fallback; on the
    # deterministic engine it propagates (nothing left to fall back to).
    timeout-ms: 45000

  servicenow:
    # Which incident journal the two comments append to:
    #   work_notes — internal, visible to fulfillers in the activity stream (default)
    #   comments   — "Additional comments", customer-facing
    write-field: work_notes

  # Bounded Sumo scopes the agent may search (J8 allowlist). FND-20: max-results and
  # max-window-minutes are now actually read and enforced in TriageMateTools.searchLogs
  # (server-side) — previously max-results was declared here but the code hardcoded 20,
  # and the time window came straight from the model with no span check at all.
  sumo:
    allowed-scopes:
      - prod/payment
      - prod/order-api
    max-results: 20
    max-window-minutes: 30

  # Credentials for real connectors. Set these in secrets.properties (preferred, see
  # above) as triage.integrations.*, or via the env vars below. Blank in the offline demo.
  integrations:
    servicenow:
      base-url: ${SNOW_BASE_URL:}          # https://<dev-instance>.service-now.com
      user:     ${SNOW_USER:}              # service account with read + write on incident
      secret:   ${SNOW_PASSWORD:}
    confluence:
      base-url: ${CONFLUENCE_BASE_URL:}
      user:     ${CONFLUENCE_EMAIL:}
      secret:   ${CONFLUENCE_API_TOKEN:}
    sumo:
      base-url: ${SUMO_BASE_URL:}
      user:     ${SUMO_ACCESS_ID:}
      secret:   ${SUMO_ACCESS_KEY:}
    gitlab:
      base-url: ${GITLAB_BASE_URL:}
      token:    ${GITLAB_TOKEN:}

logging:
  level:
    com.company.triage: INFO

---
# Convenience profile: write the two comments to a REAL ServiceNow dev ticket while
# the evidence stays mock/curated. Put the servicenow creds in secrets.properties
# (triage.integrations.servicenow.*), then run:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--spring.profiles.active=snow-live
spring:
  config:
    activate:
      on-profile: snow-live
triage:
  connectors:
    servicenow: real

spring:
  application:
    name: triage-copilot
  # Secrets live in a gitignored Java properties file at the project root (copy
  # secrets.properties.example → secrets.properties). Optional: absent for the offline
  # demo. Its triage.integrations.* values override the env placeholders below.
  config:
    import: "optional:file:secrets.properties"
  http:
    client:
      # FND-34: DiagnosisOrchestrator's timeout-ms only bounds engine.diagnose() — the
      # two ServiceNow writeback calls in runOnce() and IncidentPoller's own
      # findIncidentsCreatedSince call run directly on the caller's thread (K3's HTTP
      # request thread, or K1's single scheduler thread) with no wrapper at all, and
      # RestClient.Builder previously had no configured timeout, so a network partition
      # or a proxy that accepts a connection and never responds could hang either thread
      # forever. This is Spring Boot's global HTTP-client property namespace: it applies
      # to any Spring-autoconfigured RestClient.Builder, including RealServiceNowGateway's
      # injected one — no code change needed there. Real Confluence/Sumo/GitLab calls
      # build their own RestClient directly (not Spring-managed) and stay covered only by
      # the orchestrator's existing virtual-thread wall-clock timeout (best-effort
      # cancellation, see DiagnosisOrchestrator's javadoc) since they run solely inside
      # engine.diagnose() — the writeback/poller gap this closes is specific to ServiceNow.
      connect-timeout: 5s
      read-timeout: 20s

server:
  # 80 so the URL is just http://localhost, with no port tail — the app is meant to
  # read like a deployed service, not a dev server.
  #
  # Port 80 is privileged on macOS/Linux, so an unprivileged `mvn spring-boot:run`
  # there will fail to bind. Two ways round it, both deliberate rather than a
  # silently different default:
  #   - the run scripts detect it and fall back to 8080 with a printed note;
  #   - the e2e suite passes --server.port=8080 explicitly (tests must never need root).
  port: 80

triage:
  # Cosmetic demo convenience — pre-fills the incident-number field in the browser so
  # whoever's running the demo doesn't retype it every time. Edit the value below to
  # change it; never read by any diagnosis path. Blank leaves the field empty. NOT a
  # secret, so it lives here rather than in secrets.properties.
  ui:
    default-incident-number: INC0010005
    # Friendly hostname the startup banner offers alongside localhost. Display only —
    # the app never binds to it. It resolves to 127.0.0.1 via the machine's hosts file,
    # which bin/setup-custom-domain.sh sets up. Blank hides the line.
    public-hostname: triagemate.auspost.com.au

  # Per-connector data source: mock (offline demo data) or real (live system).
  # Mix freely — e.g. servicenow=real writes the two advisory comments to a REAL dev
  # ticket while the evidence stays mock/curated.
  connectors:
    servicenow: mock
    confluence: mock
    sumo: mock
    gitlab: mock

  # engine: 'deterministic' (default, offline, no LLM) | 'adk' (live agent, -Padk build)
  engine: deterministic

  agent:
    # FND-27: was previously an inline @Value default only, absent from both this file
    # and every card — every other triage.* key is declared here. J8's tool-call
    # budget (J2's BoundsCallback); the allowlist itself is not configurable, it's the
    # fixed set of 8 registered tools (see AdkDiagnosisEngine.ALLOWED_TOOLS).
    max-tool-calls: 10

  trigger:
    # K1 — outbound polling (DDS servicenow-local-trigger). ServiceNow can't reach a
    # corp-network laptop, so the app polls out instead of being pushed to.
    # OFF by default: the demo uses the manual POST /api/diagnose/{number} (K3), and a
    # poller waking up mid-presentation to diagnose unrelated tickets is a stage hazard.
    poll:
      enabled: false
      interval-ms: 30000     # 30s — poll latency is the accepted cost of no inbound path
      batch-limit: 10        # max incidents pulled per tick
      completed-cap: 500     # in-process completed-set bound (FND-1 layer 3)
      # FND-45: K1 (poll.enabled=true) + triage.engine=adk is unattended, programmatic LLM
      # use, which the C6 ToS ruling gates (docs/discovery/copilot-cli-runtime). Previously
      # documented only in prose; the app now WARNs at startup unless this is explicitly
      # set true — turning a silent gap into a decision on record, not a hard refusal.
      unattended-llm-ack: false

  writeback:
    # Automatic advisory write-back (J5) — two comments per run (sources first, then
    # diagnosis). No human in the loop. It only comments; never reassigns/closes/re-prioritises.
    enabled: true

  orchestrator:
    # FND-15: wall-clock bound on a single engine call (either engine — the deterministic
    # one makes real HTTP calls too once triage.connectors.*=real). A hung gateway or proxy
    # previously hung the request forever, including on the K1 poller's single scheduler
    # thread. A timeout on the ADK engine degrades via the normal FND-7 fallback; on the
    # deterministic engine it propagates (nothing left to fall back to).
    #
    # This wraps the WHOLE engine.diagnose() call, and the ADK path can make up to
    # triage.agent.max-tool-calls (10) LLM round trips against a real frontier model before
    # it's done. A too-tight timeout doesn't just fail slow runs — it makes FND-15's own
    # fallback fire on every normal-but-unhurried real run, which looks identical on stage to
    # the model actually failing and defeats D1's whole point.
    #
    # 120s — MEASURED over 3 runs, not guessed (FND-69, 2026-08-01). The LT4 spike ran the
    # real agent against a Copilot-served model with real ServiceNow + Confluence:
    #   3 tool calls → 37s mean; 8.0s ± 2.6s per tool call; 13.1s for the final report.
    #   ⇒ N calls ≈ N × 8.0s + 13.1s, so a full 10-call run ≈ 92.7s ± 8.2 (3.3 sd under 120s).
    # The previous 90s (itself self-documented as "a safer guess, not a measurement") was
    # therefore SHORTER than a run its own tool budget permits: max-tool-calls=10 allowed a
    # diagnosis that timeout-ms=90000 would kill, degrading to deterministic mid-demo
    # — indistinguishable on stage from the agent failing.
    #
    # Fixed by raising the clock rather than cutting the budget to ~7: the tool budget is a
    # J8 SAFETY bound (how much the model may do), the timeout is a LIVENESS bound (how long
    # we wait). Tightening the safety bound to paper over a liveness number would cost real
    # investigation depth — the documented flow uses up to 8 of the 8 registered tools, so 7
    # would cut into legitimate work — to fix something that isn't a safety problem.
    # 120s puts the 10-call worst case 3.3 sd clear, the realistic 8-call case 5.9 sd clear.
    # Full measurement: concepts/J11-live-thinking-trace/verification-lt4-latency/findings.md
    timeout-ms: 120000

  servicenow:
    # Which incident journal the two comments append to:
    #   work_notes — internal, visible to fulfillers in the activity stream (default)
    #   comments   — "Additional comments", customer-facing
    write-field: work_notes

    # J26 — similar-incident search. This used to be one query with the first word of the
    # subject line in it and a hardcoded 0.5 "similarity" on every row, which returned zero
    # hits against the live instance for every incident. See SimilarIncidentRanker.
    #
    # Which incident states count as resolved, as an encoded-query IN list. 6=Resolved,
    # 7=Closed out of the box — override if this instance customised its state values,
    # otherwise the search silently matches nothing.
    # 1=New is included alongside 6=Resolved and 7=Closed. MEASURED against the live dev
    # instance (2026-08-05): every incident under the Delivery Hazards CI is state=New, so
    # "6,7" retrieves ZERO candidates on both passes and the feature reports nothing —
    # the original symptom, reproduced by the fix. A young estate always looks like this;
    # it has open duplicates long before it has resolved ones, and an open duplicate is
    # still worth showing ("two people have reported this").
    # Drop back to "6,7" on an estate with real resolution history, where a resolved match
    # is strictly more useful and the extra New rows are only noise.
    resolved-states: "1,6,7"
    # Minimum score (0..1) worth reporting. 0.25 admits a same-CI match on its own: a prior
    # incident against the same system is worth a human's attention even when the two
    # reporters described the fault in different words.
    similarity-floor: 0.25
    # Cap on reported similar incidents, highest-scoring first.
    max-similar: 5

    # Operator-curated duplicate links, keyed by the incident being triaged. Retrieval and
    # the ranker can only find what the instance's text search and CMDB support; when a human
    # already KNOWS two tickets are the same problem, stating it here beats any heuristic.
    # Pins are additive, fetched by number, and rank above every scored hit.
    #
    #   similar-incidents:
    #     INC0010010:
    #       - INC0010012
    #
    # Unset means "no pins" — the two retrieval passes above still run.
    similar-incidents: {}

  # FND-20: max-results and max-window-minutes are actually read and enforced in
  # TriageMateTools.searchLogs (server-side) — previously max-results was declared here
  # but the code hardcoded 20, and the time window came straight from the model with no
  # span check at all.
  sumo:
    # The J8 guardrail is a TEMPLATE, not a list of literal scopes.
    #
    # It used to be `allowed-scopes: [prod/payment, prod/order-api]` — the model typed a
    # _sourceCategory and we checked it against that list. That was wrong for the real
    # estate twice over: those two values were demo fixtures that exist in no real Sumo,
    # and scopes aren't an access boundary here anyway (any credential that can search
    # can see every environment). Keeping a literal list would have meant hand-maintaining
    # one entry per project × environment, and a stale list silently returns zero results.
    #
    # Instead the model supplies a project slug + an environment, and the APP composes the
    # category from this pattern. That is a stronger bound than the allowlist was: the
    # model cannot type `_sourceCategory=*` or anything off-convention, because it never
    # supplies the category at all — only two narrow fields, one of which is allowlisted.
    source-category-pattern: "IDT/ITServices/Tomcat/{project}/{environment}/AppEvt_{project}"
    # Projects that don't fit the pattern above (e.g. non-Tomcat estate). Key is the
    # project slug; value is a full pattern that still supports {project}/{environment}.
    source-category-overrides: {}
    # Appended as `and _index=<value>`. Blank disables the clause entirely.
    #
    # DISABLED 2026-08-05 (operator instruction): the _index clause narrowed real searches to
    # one index and was returning nothing for the demo estate. The mechanism is kept — set a
    # value here to re-enable it — but the default query is now scope + ERROR only.
    index: ""      # empty = no `and _index=` clause
    # The {environment} allowlist — the one part of the composed category the model
    # genuinely chooses, so it stays bounded to real environment codes.
    allowed-environments:
      - pdev
      - ptest
      - stest
      - vtest
      - prod
    max-results: 20
    # 1 day. The deterministic engine now searches the LAST DAY OF DATA rather than a
    # ±10m window around opened_at (operator instruction, 2026-08-05): a ticket is often
    # raised well after the fact, and on a real instance the retained data near opened_at
    # may be gone — searching recent data is what actually finds log lines. This is also
    # the ceiling TriageMateTools clamps the ADK path's model-supplied window to.
    max-window-minutes: 1440

  gitlab:
    # J8 allowlist (FND-38: was documented as enforced but search_code accepted any
    # model-supplied project unchecked, same class of gap as FND-20's Sumo bound).
    # Enforced server-side in TriageMateTools.searchCode, not by beforeToolCallback.
    allowed-projects:
      - order-payments/payment-service

  # Credentials for real connectors. Set these in secrets.properties (preferred, see
  # above) as triage.integrations.*, or via the env vars below. Blank in the offline demo.
  integrations:
    servicenow:
      base-url: ${SNOW_BASE_URL:}          # https://<dev-instance>.service-now.com
      user:     ${SNOW_USER:}              # service account with read + write on incident
      secret:   ${SNOW_PASSWORD:}
    confluence:
      base-url: ${CONFLUENCE_BASE_URL:}
      user:     ${CONFLUENCE_EMAIL:}
      secret:   ${CONFLUENCE_API_TOKEN:}
    sumo:
      base-url: ${SUMO_BASE_URL:}
      user:     ${SUMO_ACCESS_ID:}
      secret:   ${SUMO_ACCESS_KEY:}
    gitlab:
      base-url: ${GITLAB_BASE_URL:}
      token:    ${GITLAB_TOKEN:}

logging:
  level:
    com.company.triage: INFO
    # FND-68: ADK logs a WARN per recursive type per tool while building the tool schemas —
    # six lines of "Type java.time.ZoneOffset is recursive. Omitting from schema." every run,
    # from OffsetDateTime inside our tool signatures. Harmless (the omitted part is only the
    # JSON-schema hint; arguments still serialize fine and AdkLiveRoundTripTest proves the
    # round trip), but on stage it is six red-herring WARNs scrolling past right before the
    # agent starts, which is exactly when someone is watching the console for a real problem.
    com.google.adk.tools.FunctionCallingUtils: ERROR

---
# 'real' profile: every connector live against the real system (needs every
# credential in secrets.properties — see secrets.properties.example). One flag flips
# all four; there is no separate profile for a partial mix. To run with only SOME
# connectors real (e.g. ServiceNow live, everything else mock), don't use a profile at
# all — override the individual triage.connectors.* keys directly, e.g.:
#   mvn spring-boot:run -Dtriage.connectors.servicenow=real
# Activate this profile with:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--spring.profiles.active=real
spring:
  config:
    activate:
      on-profile: real
triage:
  connectors:
    servicenow: real
    confluence: real
    sumo: real
    gitlab: real

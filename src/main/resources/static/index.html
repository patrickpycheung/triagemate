<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TriageMate</title>
  <!-- Apply the saved theme before first paint. Without this the page renders in
       the default dark theme for a frame and then repaints — very visible on a
       projector, and the exact kind of flicker you don't want mid-demo. -->
  <script>
    try {
      var t = localStorage.getItem('triagemate.theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* private mode — fall through to the default theme */ }
  </script>
  <style>
    /* ---- Theme tokens -------------------------------------------------------
       Every colour the page paints comes from one of these. Adding a theme
       below means overriding these 15 vars — no rule outside :root/[data-theme]
       may hardcode a hex, or that theme silently half-applies. Theme choice is
       cosmetic only: it never changes what the page reports (see the FND-16/25
       notes in render() — those read real DiagnosisResult fields, not colours).
    */
    :root, [data-theme="midnight"] {
      --bg:#0f1420; --card:#182030; --ink:#e8edf6; --muted:#93a1b5;
      --acc:#5aa9ff; --ok:#3ecf8e; --warn:#ffb454;
      --border:#24304a; --input-bg:#0d1220; --input-border:#2a3550;
      --chip:#243350; --inset:#0e1626; --btn-ink:#04122b; --trace:#9fb3d0;
      --banner-bg:#2a1e0c; --banner-ink:#f2b25c;
      --sn:#5fd96a; --cf:#4d9fff; --sl:#38bdf8; --gl:#ff8a4d;
    }
    /* Australia Post — the corporate read: red on white, high-key. */
    [data-theme="auspost"] {
      --bg:#f4f5f7; --card:#ffffff; --ink:#1c2b36; --muted:#5c6b7a;
      --acc:#dc1928; --ok:#0a7d54; --warn:#b45309;
      --border:#dfe3e8; --input-bg:#ffffff; --input-border:#c3ccd6;
      --chip:#fdeaec; --inset:#fbf7f7; --btn-ink:#ffffff; --trace:#4a5a6a;
      --banner-bg:#fff5e6; --banner-ink:#a35a00;
      --sn:#1f9254; --cf:#0052cc; --sl:#0b7285; --gl:#b8511c;
    }
    /* Australia Post, dark room — same red, survives a dim projector. */
    [data-theme="auspost-dark"] {
      --bg:#14100f; --card:#1f1816; --ink:#f5ece9; --muted:#b09a95;
      --acc:#ff4b57; --ok:#3ecf8e; --warn:#ffb454;
      --border:#3a2b28; --input-bg:#120e0d; --input-border:#4a3733;
      --chip:#3d1f22; --inset:#191211; --btn-ink:#1a0405; --trace:#c9b3ae;
      --banner-bg:#2e1c0a; --banner-ink:#ffb454;
      --sn:#5fd96a; --cf:#5b9bff; --sl:#4fc3f7; --gl:#ff9d54;
    }
    /* Hackathon — purple/blue, the "this is a demo day build" read. */
    [data-theme="hackathon"] {
      --bg:#120c26; --card:#1c1440; --ink:#ece8ff; --muted:#a396d4;
      --acc:#8b5cf6; --ok:#34d399; --warn:#fbbf24;
      --border:#2f2360; --input-bg:#0e0920; --input-border:#3d2f75;
      --chip:#2c2160; --inset:#160f33; --btn-ink:#0f0824; --trace:#b3a5e0;
      --banner-bg:#2b1e08; --banner-ink:#fbbf24;
      --sn:#4ade80; --cf:#60a5fa; --sl:#22d3ee; --gl:#fb923c;
    }
    /* ServiceNow — the system we're writing back into. */
    [data-theme="servicenow"] {
      --bg:#0c1a17; --card:#12251f; --ink:#e6f4ee; --muted:#8fb3a5;
      --acc:#62d84e; --ok:#62d84e; --warn:#ffb454;
      --border:#1e3d33; --input-bg:#0a1512; --input-border:#274d40;
      --chip:#17352b; --inset:#0e1f1a; --btn-ink:#04160c; --trace:#9dc4b4;
      --banner-bg:#2a1e0c; --banner-ink:#f2b25c;
      --sn:#62d84e; --cf:#5b9bff; --sl:#4fd1e8; --gl:#ffa057;
    }
    /* Paper — neutral light, for screenshots and printed handouts. */
    [data-theme="paper"] {
      --bg:#fbfbfa; --card:#ffffff; --ink:#1f2328; --muted:#656d76;
      --acc:#0969da; --ok:#1a7f37; --warn:#9a6700;
      --border:#d1d9e0; --input-bg:#ffffff; --input-border:#c9d1d9;
      --chip:#ddf4ff; --inset:#f6f8fa; --btn-ink:#ffffff; --trace:#57606a;
      --banner-bg:#fff8c5; --banner-ink:#7d4e00;
      --sn:#157347; --cf:#0052cc; --sl:#0b7285; --gl:#b8511c;
    }
    /* Projector — max contrast, thick accents. Answers the J11 legibility
       question the hard way: if it reads at the back of the room here, it reads. */
    [data-theme="projector"] {
      --bg:#000000; --card:#0d0d0d; --ink:#ffffff; --muted:#c9c9c9;
      --acc:#ffd400; --ok:#00e676; --warn:#ff9100;
      --border:#4a4a4a; --input-bg:#000000; --input-border:#6e6e6e;
      --chip:#333300; --inset:#141400; --btn-ink:#000000; --trace:#e0e0e0;
      --banner-bg:#2e2000; --banner-ink:#ffd400;
      --sn:#3ddc72; --cf:#4da6ff; --sl:#22e0ff; --gl:#ff8a3d;
    }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 20px; }
    .row { display:flex; gap:10px; margin-bottom:22px; }
    input { flex:1; padding:11px 13px; border-radius:9px; border:1px solid var(--input-border); background:var(--input-bg); color:var(--ink); font-size:15px; }
    button { padding:11px 20px; border:0; border-radius:9px; background:var(--acc); color:var(--btn-ink); font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:16px; }
    .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 10px; }
    .pill { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; background:var(--chip); color:var(--acc); margin-left:6px; }
    .bar { height:7px; background:var(--chip); border-radius:5px; overflow:hidden; margin-top:4px; }
    .bar > i { display:block; height:100%; background:var(--acc); }
    .cand { margin-bottom:12px; }
    .ev { font-size:13px; padding:8px 10px; border-left:3px solid var(--acc); background:var(--inset); margin-bottom:7px; border-radius:0 6px 6px 0; }
    .ev b { color:var(--acc); text-transform:uppercase; font-size:11px; }
    .src { color:var(--muted); }
    ul { margin:6px 0 0; padding-left:18px; }
    .trace { font:12px/1.5 ui-monospace,monospace; color:var(--trace); white-space:pre-wrap; }
    .advisory { color:var(--warn); font-size:12px; }
    .link { color:var(--acc); text-decoration:underline; }

    /* ---- LT5: trace-row visual vocabulary (J11) ------------------------------
       CSS-only building blocks for step-row rendering. TASK-014/015 wire real
       TraceStep data into rows built from these classes via the
       stepStateToDataState()/traceRowHtml() helpers in the script below —
       this task only builds and demonstrates the vocabulary (see the
       <details class="lt5-demo"> block near the bottom of <body>).
       Reuses the .ev left-rail idiom (accent border-left + inset background)
       as its structural base. State lives purely in [data-state] on
       .trace-row; motion (badge glow-pulse + rail shimmer) is layered on top
       and is NEVER the only signal — border-left color/token conveys state
       on its own. verification-lt5-projector/findings.md measured the glow
       ring at 1.31-1.69:1 contrast, below WCAG's 3:1 non-text minimum in
       EVERY theme — it's the weakest of three signals, decorative not
       load-bearing, which is also why prefers-reduced-motion can drop it
       without losing any information. */
    .trace-row {
      position:relative; overflow:hidden; display:flex; gap:10px; align-items:center;
      padding:8px 10px; margin-bottom:7px; border-radius:0 6px 6px 0;
      border-left:3px solid var(--border); background:var(--inset);
    }
    .trace-badge {
      position:relative; flex:0 0 auto; width:32px; height:32px; border-radius:8px;
      display:grid; place-items:center; background:var(--chip); color:var(--muted);
      font-weight:700; font-size:12px;
    }
    .trace-body { flex:1; min-width:0; }
    .trace-label { font-size:13px; color:var(--ink); }
    .trace-meta { font-size:11px; color:var(--muted); margin-top:1px; }

    /* -- state tokens: StepState -> data-state, NOT a lowercase of the Java
       enum. queued/active/done/fail/warn are the 5 the design already names;
       "abandoned" is this task's own extension for the ABANDONED enum value
       the CDS table doesn't cover (segment-per-attempt / honesty contract —
       see README.md lines 110-113). Mirrored 1:1 in stepStateToDataState()
       below; keep the two in sync if either changes. */
    .trace-row[data-state="queued"] { opacity:.6; }
    .trace-row[data-state="queued"] .trace-badge { color:var(--muted); }

    .trace-row[data-state="active"] { border-left-color:var(--acc); }
    .trace-row[data-state="active"] .trace-label { color:var(--acc); }
    .trace-row[data-state="active"] .trace-badge {
      color:var(--acc); animation:tt-pulse 1.4s ease-in-out infinite;
    }
    .trace-row[data-state="active"]::after {
      content:""; position:absolute; left:0; bottom:0; height:2px; width:38%;
      background:linear-gradient(90deg, transparent, var(--acc), transparent);
      animation:tt-shimmer 1.5s linear infinite;
    }

    .trace-row[data-state="done"] { border-left-color:var(--ok); }
    .trace-row[data-state="done"] .trace-badge { color:var(--ok); }

    /* FAILED and DENIED share --warn (the theme system has no dedicated
       error/red var — see :root token list at the top of this file) and are
       told apart by border style + icon glyph instead, so state is never
       carried by color alone here either. */
    .trace-row[data-state="fail"] { border-left-color:var(--warn); }
    .trace-row[data-state="fail"] .trace-badge { color:var(--warn); }
    .trace-row[data-state="fail"] .trace-label::before { content:"\2715 "; }

    .trace-row[data-state="warn"] { border-left-color:var(--warn); border-left-style:dashed; }
    .trace-row[data-state="warn"] .trace-badge { color:var(--warn); }
    .trace-row[data-state="warn"] .trace-label::before { content:"\26A0 "; }

    /* ABANDONED (J11 Invariant 1): frozen mid-run by an FND-7 degrade. Kept
       visible — never deleted, per the honesty contract — but struck through
       and dimmed so it reads as "this happened, then stopped mattering". */
    .trace-row[data-state="abandoned"] { opacity:.5; border-left-color:var(--muted); }
    .trace-row[data-state="abandoned"] .trace-badge { color:var(--muted); }
    .trace-row[data-state="abandoned"] .trace-label { text-decoration:line-through; }

    /* Glow ring and shimmer both derive their color from var(--acc) via
       color-mix() — never a hardcoded rgba(), which is the exact LT5 bug
       (sketch.html hardcoded rgba(90,169,255,…), the midnight blue, so it
       pulsed blue on every theme including auspost red and projector
       yellow). color-mix() re-derives on every theme switch automatically,
       no JS recompute needed — verified by inspection across midnight,
       auspost, hackathon, paper and projector (all 7 data-theme values
       reference var(--acc) here; grepped for hex/rgba in this block — none). */
    @keyframes tt-pulse {
      0%,100% { box-shadow:0 0 0 0 color-mix(in srgb, var(--acc) 0%, transparent); }
      50% { box-shadow:0 0 0 5px color-mix(in srgb, var(--acc) 22%, transparent); transform:scale(1.06); }
    }
    @keyframes tt-shimmer {
      0% { transform:translateX(-100%); }
      100% { transform:translateX(360%); }
    }

    /* Round-6 TRIAGEMATE decision (README.md lines 145-161): model-think and
       other non-platform rows render SUBORDINATE — no vendor badge, dimmer,
       slightly indented, connective rows rather than peers of real platform
       rows. Badging them as equals would overstate the evidence trail (only
       3 of 7 rows in the measured run touched a real system). */
    .trace-row--subordinate {
      opacity:.6; margin-left:20px; padding-left:10px;
      border-left-width:2px; border-left-style:dotted;
    }
    .trace-row--subordinate .trace-badge { display:none; }
    .trace-row--subordinate .trace-label { font-size:12.5px; }

    /* Brand-tinted badges (the --sn/--cf/--sl/--gl vars added in TASK-012).
       Identity only — which system, not what state it's in. State is always
       carried separately by border-left/icon/animation above. */
    .trace-row[data-platform="servicenow"] .trace-badge { color:var(--sn); }
    .trace-row[data-platform="confluence"] .trace-badge { color:var(--cf); }
    .trace-row[data-platform="sumologic"]  .trace-badge { color:var(--sl); }
    .trace-row[data-platform="gitlab"]     .trace-badge { color:var(--gl); }

    /* Requirement 3: reduced motion removes ALL animation (glow-pulse AND
       shimmer) — state is still conveyed, because border-left color/token,
       the icon glyph and the label text above never depended on motion in
       the first place. The static ring below is a bonus, not a requirement. */
    @media (prefers-reduced-motion:reduce) {
      .trace-row[data-state="active"] .trace-badge,
      .trace-row[data-state="active"]::after { animation:none !important; }
      .trace-row[data-state="active"] .trace-badge {
        box-shadow:0 0 0 3px color-mix(in srgb, var(--acc) 35%, transparent);
      }
      .trace-row[data-state="active"]::after { display:none; }
    }

    .lt5-demo { margin-top:26px; }
    .lt5-demo summary { cursor:pointer; color:var(--muted); font-size:12px; }
    .lt5-demo[open] summary { margin-bottom:10px; }

    /* ---- LT3: replay renderer (J11, TASK-014) --------------------------------
       Frame copy above the row list — the honesty-contract sentence carrying
       the four load-bearing words (replaying/completed/nothing is running
       now/real). See lt3FrameText() below; this rule is purely typographic. */
    .lt3-frame { color:var(--muted); font-size:12.5px; margin:-4px 0 14px; line-height:1.5; }
    .lt3-step { margin-bottom:2px; }
    /* Log-scale duration bar per row — reuses the existing .bar/.bar>i idiom
       (candidate-confidence bars above) rather than inventing a new visual
       language; only the width math (log-scale, see lt3LogScalePct()) differs. */
    .lt3-step .bar { margin:-3px 0 7px 42px; }

    /* ---- Theme picker (corner) ---- */
    .theme-btn {
      position:fixed; top:14px; right:14px; z-index:20;
      width:38px; height:38px; padding:0; display:grid; place-items:center;
      border-radius:50%; background:var(--card); color:var(--ink);
      border:1px solid var(--border); cursor:pointer;
      -webkit-appearance:none; appearance:none;
    }
    .theme-btn:hover { border-color:var(--acc); color:var(--acc); background:var(--card); }
    .theme-menu {
      position:fixed; top:60px; right:14px; z-index:20; width:232px;
      background:var(--card); border:1px solid var(--border); border-radius:12px;
      padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.35);
    }
    .theme-menu[hidden] { display:none; }
    .theme-menu h3 {
      font-size:11px; text-transform:uppercase; letter-spacing:.06em;
      color:var(--muted); margin:4px 8px 8px;
    }
    .theme-opt {
      display:flex; align-items:center; gap:9px; width:100%; padding:7px 8px;
      background:none; border:0; border-radius:8px; cursor:pointer;
      color:var(--ink); font:inherit; font-size:13.5px; text-align:left;
      -webkit-appearance:none; appearance:none;
    }
    /* Explicit color on every state, not just the base rule: a bare <button> picks up the
       browser/OS's own hover/active darkening (most visible on Safari/WebKit) unless
       appearance is reset AND color is re-asserted — otherwise the label text visibly
       dims on hover even though nothing here intends that. */
    .theme-opt:hover { background:var(--inset); color:var(--ink); }
    .theme-opt:active { background:var(--inset); color:var(--ink); }
    .theme-opt[aria-checked="true"] { background:var(--chip); color:var(--acc); font-weight:600; }
    .theme-opt[aria-checked="true"]:hover,
    .theme-opt[aria-checked="true"]:active { background:var(--chip); color:var(--acc); }
    .sw { width:15px; height:15px; border-radius:50%; flex:none; border:1px solid rgba(128,128,128,.45); }
    .theme-note { color:var(--muted); font-size:11.5px; margin:8px 8px 4px; line-height:1.45; }
    @media print { .theme-btn, .theme-menu { display:none; } }
  </style>
</head>
<body>

<!-- Theme picker. Deliberately a plain corner control: the brand direction
     (Australia Post red vs hackathon purple) is still undecided, so ship all
     the candidates and let a look at them settle it rather than guessing. -->
<button class="theme-btn" id="themeBtn" title="Change theme"
        aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="13.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="17.5" cy="10.5" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="8.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/>
    <circle cx="6.5" cy="12.5" r="1.2" fill="currentColor" stroke="none"/>
    <path d="M12 2a10 10 0 1 0 0 20c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.5-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a6 6 0 0 0 6-6c0-4.9-4.5-8.6-10-8.6z"/>
  </svg>
  <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Change theme</span>
</button>

<div class="theme-menu" id="themeMenu" role="menu" aria-labelledby="themeBtn" hidden>
  <h3>Theme</h3>
  <div id="themeList"></div>
  <p class="theme-note">Cosmetic only — never changes what the report says.
     Saved locally; <b>Projector</b> is the max-contrast one to try on the real screen.</p>
</div>

<div class="wrap">
  <h1>TriageMate <span class="pill">advisory</span></h1>
  <p class="sub">Enter a ServiceNow incident number and run a bounded, evidence-gathering diagnosis.</p>

  <div class="row">
    <input id="inc" value="INC0010005" placeholder="INC0010005"/>
    <button id="go" onclick="run()">Diagnose</button>
  </div>

  <div id="out"></div>

  <!-- LT5 dev sample section — NOT live data. Demonstrates the trace-row
       visual vocabulary (state mapping, glow/shimmer, TRIAGEMATE subordinate
       treatment) built by this task, for TASK-014/015 to consume. Collapsed
       by default so it doesn't intrude on the real demo flow; expand to
       inspect, or switch themes with the picker above while it's open to
       confirm the glow-pulse re-derives from var(--acc) per theme. -->
  <details class="lt5-demo">
    <summary>LT5 visual vocabulary — dev sample rows (not live data)</summary>
    <div id="lt5Sample"></div>
  </details>
</div>

<script>
/* ---- Theme picker -------------------------------------------------------
   Themes are pure CSS-variable overrides (see <style>), applied by setting
   data-theme on <html>. Nothing here touches report rendering — a theme can
   never change what the page claims happened.
   The list order is the review order: the two real candidates first.
*/
const THEMES = [
  { id:'auspost',      name:'Australia Post',   sw:'#dc1928' },
  { id:'hackathon',    name:'Hackathon',        sw:'#8b5cf6' },
  { id:'auspost-dark', name:'Aus Post (dark)',  sw:'#ff4b57' },
  { id:'midnight',     name:'Midnight',         sw:'#5aa9ff' },
  { id:'servicenow',   name:'ServiceNow',       sw:'#62d84e' },
  { id:'paper',        name:'Paper (light)',    sw:'#0969da' },
  { id:'projector',    name:'Projector',        sw:'#ffd400' },
];
const THEME_KEY = 'triagemate.theme';
const DEFAULT_THEME = 'midnight';

function applyTheme(id) {
  const theme = THEMES.some(t => t.id === id) ? id : DEFAULT_THEME;
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* private mode — fine */ }
  document.querySelectorAll('.theme-opt').forEach(el =>
    el.setAttribute('aria-checked', String(el.dataset.theme === theme)));
}

function initThemes() {
  const list = document.getElementById('themeList');
  const menu = document.getElementById('themeMenu');
  const btn = document.getElementById('themeBtn');

  list.innerHTML = THEMES.map(t =>
    `<button class="theme-opt" role="menuitemradio" aria-checked="false" data-theme="${t.id}">
       <span class="sw" style="background:${t.sw}"></span>${t.name}
     </button>`).join('');
  list.querySelectorAll('.theme-opt').forEach(el =>
    el.addEventListener('click', () => { applyTheme(el.dataset.theme); close(); }));

  const open = () => { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); };
  const close = () => { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  btn.addEventListener('click', e => { e.stopPropagation(); menu.hidden ? open() : close(); });
  menu.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  let saved = DEFAULT_THEME;
  try { saved = localStorage.getItem(THEME_KEY) || DEFAULT_THEME; } catch (e) { /* ignore */ }
  applyTheme(saved);
}
initThemes();

async function run() {
  const inc = document.getElementById('inc').value.trim();
  const btn = document.getElementById('go'); const out = document.getElementById('out');
  if (!inc) return;
  btn.disabled = true; out.innerHTML = '<div class="card">Investigating…</div>';

  // LT4 (J11, TASK-015): mint a runId and send it as X-Triage-Run-Id BEFORE the
  // POST — the only channel the client has to learn a runId before the run ends
  // (README.md "The runId protocol"). Sent unconditionally, even though the
  // engine isn't known yet: for a deterministic run this only costs a couple of
  // cheap poll round-trips racing a POST that resolves synchronously anyway
  // (the backend registers a buffer for it regardless of engine, per
  // DiagnosisOrchestrator#runOnce), and for an ADK run it's the only way to show
  // anything during the measured 37s-93s the POST takes to resolve. Whichever
  // engine actually answers is decided later, in render() below — see its
  // isReplay/isLive dispatch for how the two renderers never race.
  const runId = mintRunId();
  const lt4Card = document.createElement('div');
  lt4Card.className = 'card';
  out.appendChild(lt4Card);
  // Poll loop starts immediately, independent of (not awaited by) the POST
  // below — that's the whole point: an ADK run's POST won't resolve for tens
  // of seconds, and this is what fills the screen in the meantime.
  const lt4 = startLt4Poll(runId, lt4Card);

  try {
    const res = await fetch(`/api/diagnose/${encodeURIComponent(inc)}`, {
      method: 'POST',
      headers: { 'X-Triage-Run-Id': runId },
    });
    // FND-48: render() dereferences data.report.candidateSystems immediately, so a non-2xx
    // body (which has no `report`) used to surface as "TypeError: Cannot read properties of
    // undefined". Guard on res.ok first.
    // FND-52: and guard BEFORE parsing. The first cut of this fix called res.json() above
    // the res.ok check, which only works while every error is one the advice maps. Anything
    // it doesn't map still falls through to Spring's whitelabel page, and a browser fetch
    // (Accept: */*) gets HTML — so res.json() threw and the user saw
    // "SyntaxError: Unexpected token '<'". That just swapped one opaque parse error for
    // another. Read as text, then parse defensively.
    const raw = await res.text();
    let body = null;
    try { body = raw ? JSON.parse(raw) : null; } catch (_) { /* non-JSON error page */ }
    if (!res.ok) {
      const msg = (body && body.error) || res.statusText || 'request failed';
      out.innerHTML = `<div class="card">Error (${res.status}): ${esc(msg)}</div>`;
      return;
    }
    if (!body) { out.innerHTML = '<div class="card">Error: server returned a non-JSON body</div>'; return; }
    render(body);
  } catch (e) {
    out.innerHTML = `<div class="card">Error: ${e}</div>`;
  } finally {
    // Requirement 4: stop on done:true (handled inside startLt4Poll itself) OR
    // when the POST's own 200 resolves — whichever is first. This covers the
    // "POST resolves first" half unconditionally (idempotent — a no-op if the
    // poll loop already self-stopped on `done`).
    lt4.stop();
    btn.disabled = false;
  }
}

function esc(s){ return (s??'').toString().replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---- LT5 visual vocabulary building blocks -------------------------------
   Building blocks only — no live TraceStep wiring here (that's TASK-014/015).
   This is deliberately a lookup table, not a naive .toLowerCase(): PENDING,
   FAILED and DENIED all diverge from a lowercase mapping (see README.md
   lines 341-343 for the original 5; ABANDONED is this task's own extension
   for the enum value the design doc's table doesn't cover — struck-through
   per the segment-per-attempt section, README.md lines 110-113).
*/
const STEP_STATE_TO_DATA_STATE = {
  PENDING:   'queued',
  ACTIVE:    'active',
  DONE:      'done',
  FAILED:    'fail',
  DENIED:    'warn',
  ABANDONED: 'abandoned',
};
function stepStateToDataState(stepState) {
  return STEP_STATE_TO_DATA_STATE[stepState] || 'queued';
}

// Explicit self-check of all 6 mappings — no browser test runner exists for
// this static HTML/JS, so this is the closest thing to "test all five (six)
// explicitly" that runs automatically on every page load.
console.assert(stepStateToDataState('PENDING')   === 'queued',    'LT5 state mapping: PENDING');
console.assert(stepStateToDataState('ACTIVE')    === 'active',    'LT5 state mapping: ACTIVE');
console.assert(stepStateToDataState('DONE')      === 'done',      'LT5 state mapping: DONE');
console.assert(stepStateToDataState('FAILED')    === 'fail',      'LT5 state mapping: FAILED');
console.assert(stepStateToDataState('DENIED')    === 'warn',      'LT5 state mapping: DENIED');
console.assert(stepStateToDataState('ABANDONED') === 'abandoned', 'LT5 state mapping: ABANDONED');

// Row template — the reusable markup block TASK-014/015 will call per
// TraceStep to build the live-poll / replay list.
//   step = {
//     state:     StepState string ('PENDING'|'ACTIVE'|'DONE'|'FAILED'|'DENIED'|'ABANDONED'),
//     platform:  'servicenow'|'confluence'|'sumologic'|'gitlab'|'triagemate',
//     badgeText: short vendor abbreviation (ignored for 'triagemate' — no badge is shown),
//     label:     the in-progress/result label text,
//     meta:      small secondary line (platform · duration/status)
//   }
function traceRowHtml(step) {
  const dataState = stepStateToDataState(step.state);
  const subordinate = step.platform === 'triagemate';
  const cls = 'trace-row' + (subordinate ? ' trace-row--subordinate' : '');
  const badge = subordinate ? '' : `<div class="trace-badge">${esc(step.badgeText || '')}</div>`;
  return `<div class="${cls}" data-state="${esc(dataState)}" data-platform="${esc(step.platform || '')}">
    ${badge}
    <div class="trace-body">
      <div class="trace-label">${esc(step.label)}</div>
      <div class="trace-meta">${esc(step.meta || '')}</div>
    </div>
  </div>`;
}

// Dev-only demo: one sample row per data-state (plus the two real fail/warn
// variants and two TRIAGEMATE subordinate rows) so the vocabulary above is
// inspectable without live data. Lives inside the collapsed <details
// class="lt5-demo"> — expand it, then use the theme picker to confirm the
// glow-pulse ring re-derives from var(--acc) across themes.

    { state:'DONE',      platform:'confluence', badgeText:'CF', label:'Runbook found',                          meta:'confluence · 7.1 s' },
    { state:'FAILED',    platform:'sumologic',  badgeText:'SL', label:'Log query failed',                       meta:'sumologic · error' },
    { state:'DENIED',    platform:'gitlab',     badgeText:'GL', label:'Blocked an unrecognised tool call',      meta:'gitlab · denied' },
    { state:'ABANDONED', platform:'servicenow', badgeText:'SN', label:'Reading the incident…',                  meta:'servicenow · abandoned — fallback started' },
    { state:'ACTIVE',    platform:'triagemate', badgeText:'',   label:'Thinking…',                              meta:'model · in progress' },

/* ---- LT3: replay renderer (J11, TASK-014) --------------------------------
   Renders an animated post-hoc REPLAY of an already-complete deterministic
   run. The deterministic engine (and its DEGRADED_TO_DETERMINISTIC fallback,
   FND-7) runs synchronously, so `data.steps` (List<TraceStep>, STREAM-001/003)
   arrives fully resolved in the same POST response — there is never a "live"
   window to stream for that path (README.md LT3, lines 170-206). This is the
   ONLY renderer for that path; the live ADK path (data.engine === 'ADK') is
   TASK-015's job (LT4: no pacing at all, render on arrival) and this code
   must never run for it.

   Reuses stepStateToDataState()/traceRowHtml() from LT5 (TASK-013) — row
   markup is built there, not reinvented here. Only new here: mapping the
   backend Platform enum to the lowercase tokens traceRowHtml()/CSS expect,
   the log-scale duration bar, the paced sequential reveal, and the frame
   copy honesty-contract sentence.
*/

// Platform enum (SERVICENOW/CONFLUENCE/SUMO/GITLAB/TRIAGEMATE, per
// TraceStep.java) -> the lowercase tokens traceRowHtml()/[data-platform] CSS
// expect. Note SUMO -> 'sumologic', not a lowercase of the enum name.
const STEP_PLATFORM_TO_LOWER = {
  SERVICENOW: 'servicenow', CONFLUENCE: 'confluence',
  SUMO: 'sumologic', GITLAB: 'gitlab', TRIAGEMATE: 'triagemate',
};
const PLATFORM_BADGE_TEXT = {
  servicenow: 'SN', confluence: 'CF', sumologic: 'SL', gitlab: 'GL', triagemate: '',
};
function stepPlatformToLower(platform) {
  return STEP_PLATFORM_TO_LOWER[platform] || 'triagemate';
}

// Log-scale width so a 2ms step and a slow one (F-3: deterministic engine
// against real connectors) both read as visibly nonzero — the deterministic
// mock run is 2-19ms total, a linear scale would flatten every bar to
// invisible. Floored at 6% so even a 0ms/unresolved (ABANDONED) duration
// still shows a sliver rather than literally nothing.
function lt3LogScalePct(durationMs, maxDurationMs) {
  const d = Math.max(0, Number(durationMs) || 0);
  const max = Math.max(1, Number(maxDurationMs) || 1);
  const pct = Math.log(d + 1) / Math.log(max + 1) * 100;
  return Math.max(6, Math.min(100, Math.round(pct)));
}

// One row + its duration bar. `step.state === 'PENDING'` is the pre-render
// skeleton state (see renderLt3Replay) — real duration/result text is
// withheld until the row is actually revealed, so the skeleton doesn't spoil
// the "nothing is running now" framing by showing timings ahead of time.
function lt3RowHtml(step, maxDurationMs) {
  const platform = stepPlatformToLower(step.platform);
  const isQueued = step.state === 'PENDING';
  const durationMs = (!isQueued && typeof step.durationMs === 'number') ? step.durationMs : null;
  const label = isQueued
    ? (step.tool || step.label || '(step)')
    : (step.result || step.label || step.tool || '(step)');
  const durationText = durationMs != null ? `${durationMs} ms` : (isQueued ? 'queued' : String(step.state || '').toLowerCase());
  const row = traceRowHtml({
    state: step.state,
    platform,
    badgeText: PLATFORM_BADGE_TEXT[platform] || '',
    label,
    meta: `${platform} · ${durationText}`,
  });
  const pct = isQueued ? 6 : lt3LogScalePct(durationMs, maxDurationMs);
  return `<div class="lt3-step">${row}<div class="bar"><i style="width:${pct}%"></i></div></div>`;
}

// The honesty-contract frame copy (README.md LT3, lines 177-181): must carry
// all four load-bearing words verbatim — replaying, completed, "nothing is
// running now", real — so the UI can never be mistaken for something live.
function lt3FrameText(steps) {
  const totalMs = steps.reduce((sum, s) => sum + (typeof s.durationMs === 'number' ? s.durationMs : 0), 0);
  const n = steps.length;
  return `↺ Replaying a completed run — ${n} step${n === 1 ? '' : 's'} in ${totalMs} ms total. `
    + `Nothing is running now; steps are revealed at ~0.4 s each so they're readable. `
    + `The order and the timings below are real.`;
}

// Fills an already-inserted empty card element with the LT3 replay:
// frame copy + a paced, sequential reveal of each step.
//
// Pre-render only the unconditional step prefix, and only when engine !=
// ADK (README.md LT3, line 183): this replay is of an ALREADY-FINISHED run,
// so the full `steps` array from the response IS the unconditional truth —
// we never guess at a conditional step (e.g. gitlab.searchCode) that may not
// have run; we only ever pre-render placeholders for steps that actually
// happened, straight from real data. Guarded again here (not just by the
// caller) as defense in depth: this function must never activate the replay
// path for engine === 'ADK' (that path is TASK-015's, and it never paces).
function renderLt3Replay(cardEl, data) {
  const steps = Array.isArray(data.steps) ? data.steps : [];
  const t = data.trace || [];
  if (data.engine === 'ADK' || !steps.length) {
    // Not this renderer's path (or no structured steps to replay) — fall
    // back to the plain trace list so nothing regresses.
    cardEl.innerHTML = `<h2>Tool-call trace (${t.length})</h2><div class="trace">${t.map(esc).join('\n')}</div>`;
    return;
  }

  const maxDurationMs = steps.reduce((m, s) => Math.max(m, typeof s.durationMs === 'number' ? s.durationMs : 0), 0);

  cardEl.innerHTML = `<h2>Tool-call trace — replay (${steps.length})</h2>
    <p class="lt3-frame">${esc(lt3FrameText(steps))}</p>
    <div id="lt3Rows"></div>`;
  const rowsEl = cardEl.querySelector('#lt3Rows');
  rowsEl.innerHTML = steps.map(s => lt3RowHtml({ ...s, state: 'PENDING' }, maxDurationMs)).join('');

  // Paced sequential reveal — a REPLAY-ONLY rule (README.md LT3 pacing
  // table, lines 195-198): reveal step N after max(realDuration, ~0.4s).
  // Do NOT confuse this with LT4's live path, which never paces at all —
  // that "no pacing" rule belongs exclusively to TASK-015's live poll.
  const rowNodes = rowsEl.querySelectorAll('.lt3-step');
  let cumulativeDelay = 0;
  steps.forEach((step, i) => {
    const realDuration = typeof step.durationMs === 'number' ? step.durationMs : 0;
    cumulativeDelay += Math.max(realDuration, 400);
    setTimeout(() => {
      if (rowNodes[i]) rowNodes[i].outerHTML = lt3RowHtml(step, maxDurationMs);
    }, cumulativeDelay);
  });
}

/* ---- LT4: live poll renderer (J11, TASK-015) -----------------------------
   Renders the ADK path (data.engine === 'ADK') while the run is still IN FLIGHT —
   the counterpart to LT3's replay of an already-finished deterministic run.
   Measured 37s-93s per real agentic run (README.md LT4), so replay-only would
   leave the screen blank for that entire window; this is the fix.

   The protocol (README.md "The runId protocol", Round 3): the client mints a
   runId BEFORE the POST (the only channel to learn one before the run ends),
   sends it as X-Triage-Run-Id, and polls GET /api/runs/{runId}/steps?since={n}
   concurrently with the in-flight POST. `since` is a GLOBAL flattened-position
   index (RunStepsController's javadoc), not a per-attempt seq — tracked here as
   a running total of steps received so far (see startLt4Poll).

   NO PACING — the exact opposite of LT3's renderLt3Replay. A live step is
   measured 8.0s +/- 2.6 apart, far above any perceptible pacing floor, so
   "pacing" it would only ever mean artificially delaying something the
   audience is already waiting on (README.md lines 190-206, the pacing table).
   Every row here renders the instant its poll response arrives.

   Reuses traceRowHtml()/stepStateToDataState()/stepPlatformToLower() from LT5
   (TASK-013) and PLATFORM_BADGE_TEXT from LT3 (TASK-014) — row markup and the
   platform/badge lookup are never reimplemented here.
*/
const LT4_POLL_INTERVAL_MS = 750; // within the design's ~500ms-1s window

// Client-minted runId (UUID). Only ever used as an opaque poll-buffer key
// (X-Triage-Run-Id / RunTraceRegistry) — never parsed, so a strict RFC4122
// generator isn't required, just a fresh unpredictable-enough string per call.
function mintRunId() {
  if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
    return crypto.randomUUID();
  }
  // Fallback for a context without crypto.randomUUID (older browser, or a
  // non-secure context that isn't localhost) — v4-shaped is enough here.
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

// One row, built for immediate (unpaced) display — no duration bar, no PENDING
// skeleton like LT3's lt3RowHtml: a live step only ever arrives once it's a
// real event (ACTIVE at the earliest), so there's nothing to pre-render.
function lt4RowHtml(step) {
  const platform = stepPlatformToLower(step.platform);
  const isOpen = step.state === 'ACTIVE' || step.state === 'PENDING';
  const label = isOpen
    ? (step.label || step.tool || '(step)')
    : (step.result || step.label || step.tool || '(step)');
  const durationText = typeof step.durationMs === 'number'
    ? `${step.durationMs} ms`
    : String(step.state || '').toLowerCase();
  return traceRowHtml({
    state: step.state,
    platform,
    badgeText: PLATFORM_BADGE_TEXT[platform] || '',
    label,
    meta: `${platform} · ${durationText}`,
  });
}

// Starts polling runId's live buffer and appending new rows into cardEl as
// soon as each poll returns them. Returns { stop() } — idempotent — so the
// caller can halt it from either governing condition (README.md requirement
// 4): done:true from the poll response, or the original POST's own 200
// resolving, whichever comes first.
//
// Requirement 6 (FND-7 mid-run degrade): no special-casing is needed here.
// abandonAndStartFallback() re-tags attempt 0's un-consumed rows ABANDONED
// in place and appends a synthetic FALLBACK_STARTED boundary row (platform
// TRIAGEMATE, state DONE, label "Falling back to the deterministic engine")
// as a genuinely NEW step — so it arrives through this same poll loop and
// renders through this same lt4RowHtml/traceRowHtml path: ABANDONED steps get
// TASK-013's existing struck-through/dimmed treatment (stepStateToDataState
// maps ABANDONED -> 'abandoned' already), and the boundary row's own label
// text visibly announces the transition, rather than either being silently
// dropped or requiring a bespoke second code path.
function startLt4Poll(runId, cardEl) {
  cardEl.innerHTML = '<h2>Tool-call trace — live</h2><div id="lt4Rows"></div>';
  const rowsEl = cardEl.querySelector('#lt4Rows');
  let since = -1; // -1 == "send everything so far" (RunStepsController default)
  let stopped = false;
  let timer = null;

  function stop() {
    if (stopped) return;
    stopped = true;
    if (timer) clearTimeout(timer);
  }

  async function poll() {
    if (stopped) return;
    try {
      const res = await fetch(`/api/runs/${encodeURIComponent(runId)}/steps?since=${since}`);
      if (res.status === 404) {
        // TASK-011/requirement 6: unknown or TTL-evicted runId — stop cleanly.
        // Not retried: this endpoint's 404 is defined as terminal ("stop
        // polling, this run is gone" per RunNotFoundException's own javadoc),
        // and the POST's own response remains the authoritative final answer
        // regardless of what polling did or didn't see.
        stop();
        return;
      }
      if (res.ok) {
        const data = await res.json();
        let newCount = 0;
        for (const attempt of (data.attempts || [])) {
          const steps = attempt.steps || [];
          if (steps.length) {
            rowsEl.insertAdjacentHTML('beforeend', steps.map(lt4RowHtml).join(''));
            newCount += steps.length;
          }
        }
        // since indexes a POSITION in the flattened, strictly-append-only step
        // list (RunStepsController javadoc) — every step index > since was just
        // delivered, contiguously, so advancing by the count received is exact.
        since += newCount;
        if (data.done) { stop(); return; }
      }
      // A non-404, non-ok response (transient 5xx) is swallowed here rather
      // than stopping the loop — the POST is still the run's actual owner and
      // this is just its progress feed; one bad poll shouldn't blind the rest.
    } catch (e) {
      // Network hiccup — same reasoning: keep polling, don't crash the UI.
    }
    if (!stopped) timer = setTimeout(poll, LT4_POLL_INTERVAL_MS);
  }
  poll();
  return { stop };
}

// Fills cardEl with the run's FINAL, fully-settled steps once the POST's own
// 200 has landed — data.steps (DiagnosisResult, always populated regardless
// of engine) is the ground truth. This corrects any staleness the poll loop
// could not see: RunStepsController's since-index scheme only ever re-sends
// a genuinely NEW position, so a step whose row resolved (ACTIVE -> DONE)
// AFTER an earlier poll had already delivered its ACTIVE row at that index
// never gets a live update (its javadoc calls this "bounded and
// self-healing") — this settle-render is exactly that healing step. Also
// still governed by "no pacing, ever": rendered in one shot, no setTimeout.
function renderLt4Final(cardEl, data) {
  const steps = Array.isArray(data.steps) ? data.steps : [];
  const t = data.trace || [];
  if (!steps.length) {
    cardEl.innerHTML = `<h2>Tool-call trace (${t.length})</h2><div class="trace">${t.map(esc).join('\n')}</div>`;
    return;
  }
  cardEl.innerHTML = `<h2>Tool-call trace — live (${steps.length})</h2><div>${steps.map(lt4RowHtml).join('')}</div>`;
}

function render(data) {
  const r = data.report, t = data.trace || [];
  const cands = r.candidateSystems.map(c => `
    <div class="cand"><div>${esc(c.name)} <span class="src">${Math.round(c.confidence*100)}%</span></div>
    <div class="bar"><i style="width:${Math.round(c.confidence*100)}%"></i></div></div>`).join('');
  // FND-25: J7 always claimed "source badges + links" here; the link half was never
  // rendered (only the reconstructed sources-comment preview below had it).
  const ev = r.evidence.map(e => `<div class="ev"><b>${esc(e.source)}</b> — ${esc(e.summary)}${e.link?` <span style="color:var(--acc);text-decoration:underline">[${esc(e.link)}]</span>`:''}</div>`).join('');
  const miss = (r.missingInformation||[]).map(m=>`<li>${esc(m)}</li>`).join('');
  const contra = (r.contradictingEvidence||[]).map(m=>`<li>${esc(m)}</li>`).join('');
  const sources = r.evidence.map(e => `<li><b>${esc(e.source)}</b> — ${esc(e.summary)}${e.link?` <span style="color:var(--acc);text-decoration:underline">[${esc(e.link)}]</span>`:''}</li>`).join('');
  const contacts = (r.suggestedContacts||[]).map(c => `
    <div class="ev" style="border-left-color:var(--ok)">
      <div><b style="color:var(--ok)">${esc(c.source)}</b> &nbsp;<span style="font-weight:600">${esc(c.name)}</span>${c.handle?` <span class="src">&lt;${esc(c.handle)}&gt;</span>`:''}</div>
      <div style="margin-top:3px">${esc(c.reason)}</div>
      ${c.signal?`<div class="src" style="margin-top:2px;font-size:12px">${esc(c.signal)}</div>`:''}
    </div>`).join('');
  const cmt = 'border-left:3px solid var(--acc);background:var(--inset);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:12px';
  const badge = 'font:600 11px ui-monospace,monospace;letter-spacing:.05em;color:var(--acc);display:block;margin-bottom:8px';
  // Which engine actually produced this report? The orchestrator degrades from the live
  // ADK agent to the deterministic engine on failure (FND-7) and discloses it via
  // data.engine — a real field on DiagnosisResult, not prose. Read that field directly
  // (FND-16): matching the trace line's wording was never a contract (FND-8's own
  // resolution says so), and it would have silently broken the moment that line's text
  // changed. Mistaking a degraded run for a live one means narrating "frontier model
  // reasoning" over deterministic output, so say it loudly, at the top, off a real signal.
  const degraded = data.engine === 'DEGRADED_TO_DETERMINISTIC';
  const degradedLine = t.find(s => /degraded to the deterministic engine/i.test(s || ''));
  const banner = degraded ? `
    <div class="card" style="border:1px solid var(--banner-ink);background:var(--banner-bg)">
      <h2 style="color:var(--banner-ink);margin-top:0">⚠ Degraded run — this is NOT the live agent</h2>
      <p style="margin:0 0 8px">The live ADK agent failed, so this report was produced by the
      <b>offline deterministic engine</b>. The output below is real and complete, but
      <b>no LLM was involved</b> — do not describe it as model reasoning.</p>
      ${degradedLine ? `<div class="trace" style="color:var(--banner-ink)">${esc(degradedLine)}</div>` : ''}
    </div>` : '';

  // FND-25: this card previously rendered unconditionally, reconstructed client-side
  // from the report, regardless of whether writeback actually ran — with
  // triage.writeback.enabled=false the audience was told comments were posted when
  // none were. data.writebackPosted is set by DiagnosisOrchestrator AFTER the write
  // decision, the only place that actually knows.
  const writebackCard = data.writebackPosted ? `
    <div class="card"><h2>Posted to ServiceNow — automatically</h2>
      <p style="color:var(--muted);margin:-4px 0 14px;font-size:13px">Two advisory comments, sources first. It only comments — never reassigns, closes, or changes the ticket.</p>
      <div style="${cmt}"><span style="${badge}">AI TRIAGE &middot; SOURCES CONSULTED</span><ul style="margin:0;padding-left:18px">${sources||'<li>—</li>'}</ul></div>
      <div style="${cmt}"><span style="${badge}">AI TRIAGE &middot; FIRST-PASS DIAGNOSIS</span>
        <p style="margin:0 0 5px"><b>What happened:</b> ${esc(r.reportedSymptom)}</p>
        <p style="margin:0 0 5px"><b>Likely system:</b> ${esc((r.candidateSystems[0]||{}).name||'—')} &nbsp; <b>Likely team:</b> ${esc(r.suggestedAssignment.group)} (${esc(r.suggestedAssignment.confidence)})</p>
        <p style="margin:0 0 5px"><b>Next check:</b> ${esc(r.recommendedNextAction)}</p>
        <p class="advisory" style="margin:0">Advisory only — no reassignment or changes made. The assigned engineer decides.</p></div>
    </div>` : `
    <div class="card"><h2>ServiceNow write-back — NOT posted</h2>
      <p style="color:var(--muted);margin:-4px 0 0;font-size:13px"><code>triage.writeback.enabled=false</code> — the diagnosis below is real, but nothing was written to the ticket. This is a config toggle, not a failure.</p>
    </div>`;

  // LT3 (TASK-014): the deterministic engine (and its DEGRADED_TO_DETERMINISTIC
  // fallback) finishes synchronously with a full `steps` array already in
  // this response — replay it, paced. The live ADK path (engine === 'ADK')
  // gets none of this pre-rendering; that's LT4 below (TASK-015, no pacing).
  //
  // LT4 (TASK-015): engine === 'ADK' means this response is the tail end of the
  // run startLt4Poll() has been progressively rendering into its own card since
  // before this POST was even sent. isReplay and isLive are mutually exclusive
  // (data.engine !== 'ADK' vs === 'ADK') and each owns a DIFFERENT card id
  // (lt3Card vs lt4Card) that only exists after this innerHTML write below — so
  // there is exactly one render call for exactly one fresh element per run;
  // they can never both fire, race, or double-render the same node. The
  // progressive DOM startLt4Poll() built (inside run()'s now-detached lt4Card)
  // is simply discarded here in favour of renderLt4Final()'s one-shot render
  // straight from data.steps — the settled, authoritative picture (see
  // renderLt4Final's own comment for why a fresh render, not a patch, is
  // needed to heal any staleness the poll loop couldn't see).
  const isReplay = data.engine !== 'ADK' && Array.isArray(data.steps) && data.steps.length > 0;
  const isLive = data.engine === 'ADK';
  let traceCardHtml;
  if (isReplay) {
    traceCardHtml = '<div class="card" id="lt3Card"></div>';
  } else if (isLive) {
    traceCardHtml = '<div class="card" id="lt4Card"></div>';
  } else {
    traceCardHtml = `<div class="card"><h2>Tool-call trace (${t.length})</h2><div class="trace">${t.map(esc).join('\n')}</div></div>`;
  }

  document.getElementById('out').innerHTML = `
    ${banner}
    <div class="card"><h2>Diagnosis — ${esc(r.incidentNumber)} <span class="advisory">${r.advisory?'ADVISORY ONLY — no reassignment performed':''}</span></h2>
      <p><b>Symptom:</b> ${esc(r.reportedSymptom)}</p>
      <p><b>Affected function:</b> ${esc(r.affectedFunction)} &nbsp; <b>Env:</b> ${esc(r.environment)} &nbsp; <b>Overall confidence:</b> ${esc(r.confidenceOverall)}</p>
    </div>
    <div class="card"><h2>Candidate systems</h2>${cands}</div>
    <div class="card"><h2>Suggested assignment</h2>
      <p>${esc(r.suggestedAssignment.group)} <span class="pill">${esc(r.suggestedAssignment.confidence)}</span></p></div>
    <div class="card"><h2>Who to talk to</h2>
      <p style="color:var(--muted);margin:-4px 0 12px;font-size:13px">People with recent context — wiki authors of the runbooks consulted and recent committers to the implicated file. Advisory; shown here only, not posted to the ticket.</p>
      ${contacts||'<p class="src">— no contacts found for this incident</p>'}</div>
    <div class="card"><h2>Evidence</h2>${ev}</div>
    <div class="card"><h2>Contradicting evidence</h2><ul>${contra||'<li>—</li>'}</ul></div>
    <div class="card"><h2>Missing information</h2><ul>${miss||'<li>—</li>'}</ul></div>
    <div class="card"><h2>Recommended next action</h2><p>${esc(r.recommendedNextAction)}</p></div>
    ${writebackCard}
    ${traceCardHtml}`;

  if (isReplay) renderLt3Replay(document.getElementById('lt3Card'), data);
  else if (isLive) renderLt4Final(document.getElementById('lt4Card'), data);
}
</script>
</body>
</html>

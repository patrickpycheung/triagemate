# 'real' profile: use REAL connectors for ALL four systems (needs every credential).
# For the hackathon demo you usually want ONLY real ServiceNow — use the 'snow-live'
# profile in application.yml instead. Credentials come from the env placeholders in
# application.yml (triage.integrations.*). Activate: --spring.profiles.active=real
triage:
  connectors:
    servicenow: real
    confluence: real
    sumo: real
    gitlab: real

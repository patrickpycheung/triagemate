spring:
  application:
    name: triage-copilot
  # 'mock' selects the offline demo gateways (J3/J7). Swap individual gateways to
  # 'real' as connectivity (JS-2) lands. Default profile keeps the demo self-contained.
  profiles:
    active: mock

server:
  port: 8080

triage:
  # engine: 'deterministic' (default, offline, no LLM) | 'adk' (live agent, -Padk build)
  engine: deterministic

  writeback:
    # Automatic advisory write-back to ServiceNow (J5) — two comments per run
    # (sources first, then the first-pass diagnosis). No human in the loop. It only
    # comments; it never reassigns, closes, or re-prioritises the ticket (J8).
    # Safe in the default 'mock' profile (the mock gateway just logs the comments).
    enabled: true

  # Bounded Sumo scopes the agent may search (J8 allowlist). Anything else is rejected.
  sumo:
    allowed-scopes:
      - prod/payment
      - prod/order-api
    max-results: 20

logging:
  level:
    com.company.triage: INFO
